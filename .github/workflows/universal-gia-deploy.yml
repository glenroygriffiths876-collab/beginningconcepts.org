name: Deploy Universal Gia STAGING
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'universal-ai/gateway/**'
      - '.github/workflows/universal-gia-deploy.yml'
jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: universal-ai/gateway
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run gateway tests
        run: npm test
      - name: Check deployment credentials (without exposing values)
        env:
          PRIMARY_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          LEGACY_TOKEN: ${{ secrets.API_TOKEN }}
          ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$PRIMARY_TOKEN" ] && [ -z "$LEGACY_TOKEN" ]; then
            echo "::error::Missing Cloudflare API token. Add repository Actions secret CLOUDFLARE_API_TOKEN (or API_TOKEN)."
            exit 1
          fi
          if [ -z "$ACCOUNT_ID" ]; then
            echo "::error::Missing repository Actions secret CLOUDFLARE_ACCOUNT_ID."
            exit 1
          fi
      - name: Deploy gateway
        run: npx --yes wrangler@4 deploy --config wrangler.staging.toml
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN || secrets.API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
