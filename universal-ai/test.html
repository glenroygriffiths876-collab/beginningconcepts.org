<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Universal Gia · AI Staging Test</title><style>
:root{font-family:system-ui,-apple-system,sans-serif;color:#e9f2ff;background:#091326}body{margin:0;padding:24px;display:grid;place-items:center;min-height:90vh}main{max-width:620px;width:100%;padding:28px;border:1px solid #345078;border-radius:24px;background:#132341;box-sizing:border-box}h1{margin:0 0 8px}p{color:#c4d6ef;line-height:1.5}textarea{width:100%;box-sizing:border-box;padding:14px;border-radius:12px;background:#eef5ff;color:#132341;font:inherit;min-height:90px}button{background:#4aabff;border:0;border-radius:12px;padding:13px 22px;font-weight:700;margin-top:12px;cursor:pointer}button:disabled{opacity:.6}pre{white-space:pre-wrap;overflow-wrap:anywhere;padding:18px;border-radius:12px;background:#071225;min-height:60px}small{color:#b9cce5}</style></head><body><main>
<h1>Gia · Staging AI Test</h1><p>This tests the new shared AI engine, not the existing live website chatbot. Public Beginning Concepts information only.</p>
<label for="question">Ask Gia</label><textarea id="question">What services does Beginning Concepts offer?</textarea><button id="send">Test AI response</button>
<p id="status" role="status">Ready</p><pre id="answer" aria-live="polite">Response will appear here.</pre><small>20 AI requests/day across the staging pilot. No API token is needed or stored in this page.</small></main>
<script>
const btn=document.getElementById('send'), status=document.getElementById('status'), answer=document.getElementById('answer');
btn.addEventListener('click',async()=>{const message=document.getElementById('question').value.trim();if(!message)return;btn.disabled=true;status.textContent='Contacting staging AI…';answer.textContent='';try{const response=await fetch('https://universal-gia-staging.glenroygriffiths876.workers.dev/v1/beginning-concepts',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({message})});const data=await response.json();status.textContent='HTTP '+response.status+(data.mode?' · '+data.mode:'');answer.textContent=data.reply||data.error||JSON.stringify(data);}catch(e){status.textContent='Connection failed';answer.textContent=String(e.message||e)}finally{btn.disabled=false}});
</script></body></html>
