<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Snake | Beginning Concepts</title>
  <style>
    *{
      margin:0;padding:0;box-sizing:border-box;
      -webkit-tap-highlight-color:transparent;
      -webkit-touch-callout:none;
      -webkit-user-select:none;user-select:none;
    }
    html,body{
      height:100%;
      overflow:hidden;
      background:#000;
      font-family:monospace,system-ui,sans-serif;
      color:#D4AF37;
      touch-action:none;
    }

    :root{
      --bg:#000000;
      --panel:#0f0f10;
      --panel2:#121214;
      --gold:#D4AF37;        /* premium gold */
      --goldBright:#FFD400;  /* brighter accent */
      --border:rgba(212,175,55,.35);
    }

    #container{
      display:flex;
      flex-direction:column;
      height:100%;
      width:100%;
      padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
    }

    #brandBar{
      display:flex;
      justify-content:center;
      align-items:center;
      padding:10px 10px 6px;
      background:var(--bg);
      border-bottom:1px solid rgba(255,255,255,.06);
      gap:10px;
    }
    #brandLogo{
      max-width:175px;
      height:auto;
      display:block;
      filter: drop-shadow(0 0 10px rgba(212,175,55,.18));
    }

    #scoreContainer{
      text-align:center;
      padding:10px 10px 6px;
      font-size:1.45rem;
      font-weight:900;
      background:var(--panel);
      letter-spacing:1px;
      border-bottom:1px solid rgba(255,255,255,.06);
    }

    #promoText{
      text-align:center;
      font-size:0.92rem;
      padding:8px 12px 10px;
      background:var(--panel2);
      color:var(--gold);
      line-height:1.3;
      border-bottom:1px solid rgba(255,255,255,.06);
    }
    #promoText strong{ color: var(--goldBright); }

    #canvasWrapper{
      flex:1;
      display:flex;
      justify-content:center;
      align-items:center;
      position:relative;
      overflow:hidden;
      padding:8px;
      background:var(--bg);
    }
    canvas{
      display:block;
      background:#000;
      max-width:100%;
      max-height:100%;
      image-rendering:pixelated;
      touch-action:none;
      border:1px solid var(--border);
    }

    #landscapeWarning{
      display:none;
      position:absolute;
      inset:0;
      background:rgba(0,0,0,.92);
      color:var(--goldBright);
      justify-content:center;
      align-items:center;
      text-align:center;
      padding:20px;
      font-size:1.2rem;
      z-index:20;
      pointer-events:auto;
    }

    #overlay{
      position:absolute;
      inset:0;
      background:rgba(0,0,0,.86);
      display:none;
      justify-content:center;
      align-items:center;
      flex-direction:column;
      color:var(--goldBright);
      font-size:2.0rem;
      font-weight:900;
      text-align:center;
      z-index:15;
      padding:20px;
      pointer-events:auto;
    }
    #overlaySub{
      font-size:1.05rem;
      margin-top:14px;
      color:var(--gold);
      font-weight:700;
      line-height:1.35;
      white-space:pre-line;
    }
    #overlayTiny{
      margin-top:10px;
      font-size:0.78rem;
      opacity:.75;
      color:rgba(212,175,55,.85);
      font-weight:700;
    }

    #controls{
      display:flex;
      flex-direction:column;
      align-items:center;
      padding:10px 14px;
      background:var(--panel);
      gap:10px;
      border-top:1px solid rgba(255,255,255,.06);
    }
    .dpadRow{
      display:flex;
      justify-content:center;
      gap:10px;
    }
    .dpadBtn{
      width:70px;height:70px;
      background:#161617;
      color:var(--goldBright);
      border:2px solid var(--gold);
      border-radius:12px;
      font-size:1.9rem;
      display:flex;
      justify-content:center;
      align-items:center;
      touch-action:manipulation;
      box-shadow: 0 0 14px rgba(212,175,55,.08);
    }
    .dpadBtn:active{ background:#222; }

    #finePrint{
      text-align:center;
      font-size:0.72rem;
      padding:6px 10px;
      background:var(--panel2);
      color:rgba(212,175,55,.70);
      border-top:1px solid rgba(255,255,255,.06);
    }

    @media (max-height:720px){
      #scoreContainer{font-size:1.28rem;}
      #promoText{font-size:0.86rem;padding:7px 10px 9px;}
      .dpadBtn{width:64px;height:64px;font-size:1.7rem;}
      #controls{padding:9px 12px;gap:8px;}
      #brandLogo{max-width:155px;}
    }
  #container{max-width:760px;margin:auto} html,body{background:#081b30} :root{--bg:#081b30;--panel:#102b46;--panel2:#142f4c} #brandLogo{width:76px;height:54px;object-fit:contain;background:white;border-radius:8px} #brandBar{font-family:system-ui,sans-serif} #controls{gap:5px;padding:5px} .dpadBtn{width:48px;height:48px;background:#102b46} @media(min-width:800px){#controls{flex-direction:row;justify-content:center}} </style>
</head>
<body>
  <div id="container">

    <div id="brandBar">
      <a href="../" aria-label="Return to Beginning Concepts"><img id="brandLogo" alt="Beginning Concepts" src="../assets/brand-logo.webp"></a><div><strong>BEGINNING CONCEPTS</strong><br><small>Snake · Game demo</small></div>
    </div>

    <div id="scoreContainer">
      SCORE: <span id="score">0</span>
      &nbsp;&nbsp;•&nbsp;&nbsp;
      HIGH: <span id="highScore">0</span>
    </div>

    <div id="promoText">
      Beat your <strong>high score</strong> · Swipe or use arrow keys
    </div>

    <div id="canvasWrapper">
      <canvas id="gameCanvas"></canvas>

      <div id="landscapeWarning">📱 Please rotate to portrait mode to play!</div>

      <div id="overlay">
        <div id="overlayText">GAME OVER</div>
        <div id="overlaySub">Tap to Restart</div>
        <div id="overlayTiny"></div>
      </div>
    </div>

    <div id="controls">
      <div class="dpadRow">
        <div class="dpadBtn" id="upBtn" aria-label="Up">↑</div>
      </div>
      <div class="dpadRow">
        <div class="dpadBtn" id="leftBtn" aria-label="Left">←</div>
        <div class="dpadBtn" id="downBtn" aria-label="Down">↓</div>
        <div class="dpadBtn" id="rightBtn" aria-label="Right">→</div>
      </div>
    </div>

    <div id="finePrint">
      Interactive game demo · Beginning Concepts
    </div>

  </div>

  <script>
    (function(){
      "use strict";

      const canvas = document.getElementById("gameCanvas");
      const ctx = canvas.getContext("2d", { alpha:false });

      const scoreEl = document.getElementById("score");
      const highScoreEl = document.getElementById("highScore");

      const overlay = document.getElementById("overlay");
      const overlayText = document.getElementById("overlayText");
      const overlaySub = document.getElementById("overlaySub");
      const overlayTiny = document.getElementById("overlayTiny");

      const landscapeWarning = document.getElementById("landscapeWarning");

      const upBtn = document.getElementById("upBtn");
      const downBtn = document.getElementById("downBtn");
      const leftBtn = document.getElementById("leftBtn");
      const rightBtn = document.getElementById("rightBtn");

      const GOLD = "#D4AF37";
      const GOLD_BRIGHT = "#FFD400";

      const CELL = 20;
      let gridW = 0, gridH = 0, dpr = 1;

      let snake = [];
      let food = {x:0,y:0};
      let dir = {x:1,y:0};
      let queued = {x:1,y:0};
      let turnLocked = false;

      let score = 0;
      let highScore = 0;
      let gameOver = false;

      const BASE_SPEED = 10;
      const SPEED_INC = 0.5;
      const MAX_SPEED  = 20;
      let speed = BASE_SPEED;

      let lastT = 0;
      let acc = 0;

      function isLandscape(){
        return false;
      }

      function showOverlay(on, title, sub){
        overlay.style.display = on ? "flex" : "none";
        if (title) overlayText.textContent = title;
        if (sub) overlaySub.textContent = sub;
      }

      function loadHighScore(){
        const v = Number(localStorage.getItem("bcSnakeDemoHighScore") || "0");
        highScore = Number.isFinite(v) ? v : 0;
        highScoreEl.textContent = String(highScore);
      }

      function saveHighScoreIfNeeded(){
        if (score > highScore){
          highScore = score;
          localStorage.setItem("bcSnakeDemoHighScore", String(highScore));
          highScoreEl.textContent = String(highScore);
          return true;
        }
        return false;
      }

      function resize(){
        const wrap = document.getElementById("canvasWrapper");

        const land = isLandscape();
        landscapeWarning.style.display = land ? "flex" : "none";
        canvas.style.display = land ? "none" : "block";

        const usable = Math.min(wrap.clientWidth, wrap.clientHeight);
        const cssSize = Math.max(120, Math.floor(usable));
        const cells = Math.max(8, Math.floor(cssSize / CELL));

        gridW = cells;
        gridH = cells;

        dpr = Math.max(1, Math.min(3, window.devicePixelRatio || 1));
        canvas.style.width = (gridW * CELL) + "px";
        canvas.style.height = (gridH * CELL) + "px";
        canvas.width = Math.floor(gridW * CELL * dpr);
        canvas.height = Math.floor(gridH * CELL * dpr);

        ctx.setTransform(1,0,0,1,0,0);
        ctx.scale(dpr,dpr);

        reset();
      }

      function initSnake(){
        const sx = Math.floor(gridW/2);
        const sy = Math.floor(gridH/2);
        snake = [
          {x:sx, y:sy},
          {x:sx-1, y:sy},
          {x:sx-2, y:sy}
        ];
      }

      function placeFood(){
        const occ = new Set(snake.map(s => s.x + "," + s.y));
        const empties = [];
        for (let x=0; x<gridW; x++){
          for (let y=0; y<gridH; y++){
            const k = x + "," + y;
            if (!occ.has(k)) empties.push({x,y});
          }
        }
        if (empties.length === 0){
          gameOver = true;
          showOverlay(true, "YOU WIN!", "Tap to Restart");
          overlayTiny.textContent = "";
          return;
        }
        food = empties[(Math.random() * empties.length) | 0];
      }

      function reset(){
        if (!gridW || !gridH) return;

        score = 0;
        scoreEl.textContent = "0";

        dir = {x:1,y:0};
        queued = {x:1,y:0};
        turnLocked = false;

        speed = BASE_SPEED;
        gameOver = false;
        showOverlay(false);
        overlayTiny.textContent = "";

        initSnake();
        placeFood();

        acc = 0;
        lastT = performance.now();

        draw();
      }

      function setDir(nd){
        if (gameOver) return;
        if (turnLocked) return;

        if (nd.x === -dir.x && nd.y === -dir.y) return;
        if (nd.x === dir.x && nd.y === dir.y) return;

        queued = {x:nd.x, y:nd.y};
        turnLocked = true;
      }

      function endGame(){
        gameOver = true;

        const newBest = saveHighScoreIfNeeded();

        showOverlay(true, "GAME OVER", "Score " + score + " • Tap to Restart");

        if (score >= 200){
          overlaySub.textContent = "🎉 Excellent score!\nTap to Restart";
        }

        overlayTiny.textContent = newBest ? "New High Score Saved ✅" : ("High Score: " + highScore);
      }

      function step(){
        if (gameOver) return;
        if (!snake.length) return;

        dir = {x:queued.x, y:queued.y};

        const head = snake[0];
        let nx = head.x + dir.x;
        let ny = head.y + dir.y;

        if (nx < 0) nx = gridW - 1;
        if (nx >= gridW) nx = 0;
        if (ny < 0) ny = gridH - 1;
        if (ny >= gridH) ny = 0;

        const willEat = (nx === food.x && ny === food.y);

        const checkLen = willEat ? snake.length : snake.length - 1;
        for (let i=0; i<checkLen; i++){
          if (snake[i].x === nx && snake[i].y === ny){
            endGame();
            return;
          }
        }

        snake.unshift({x:nx, y:ny});

        if (willEat){
          score++;
          scoreEl.textContent = String(score);
          if (score % 5 === 0 && speed < MAX_SPEED){
            speed = Math.min(MAX_SPEED, speed + SPEED_INC);
          }
          placeFood();
        } else {
          snake.pop();
        }

        turnLocked = false;
      }

      function draw(){
        ctx.fillStyle = "#081b30";
        ctx.fillRect(0,0,gridW*CELL, gridH*CELL);

        ctx.save();
        ctx.fillStyle = GOLD_BRIGHT;
        ctx.shadowColor = GOLD_BRIGHT;
        ctx.shadowBlur = 10;
        const fx = food.x * CELL + CELL/2;
        const fy = food.y * CELL + CELL/2;
        ctx.beginPath();
        ctx.arc(fx, fy, CELL/2 - 2, 0, Math.PI*2);
        ctx.fill();
        ctx.restore();

        ctx.save();
        ctx.fillStyle = GOLD;
        ctx.shadowColor = GOLD;
        ctx.shadowBlur = 8;
        for (let i=0; i<snake.length; i++){
          const s = snake[i];
          ctx.fillRect(s.x*CELL+1, s.y*CELL+1, CELL-2, CELL-2);
        }
        ctx.restore();
      }

      function loop(t){
        requestAnimationFrame(loop);

        if (isLandscape()){
          draw();
          return;
        }

        if (!lastT) lastT = t;
        let dt = (t - lastT)/1000;
        lastT = t;

        if (dt > 0.25) dt = 0.25;

        acc += dt;
        if (acc > 0.2) acc = 0.2;

        const stepTime = 1 / speed;
        while (acc >= stepTime){
          step();
          acc -= stepTime;
        }

        draw();
      }

      function bindPress(el, fn){
        el.addEventListener("pointerdown", (e) => {
          e.preventDefault();
          e.stopPropagation();
          fn();
        }, { passive:false });
      }

      bindPress(upBtn,    () => setDir({x:0,y:-1}));
      bindPress(downBtn,  () => setDir({x:0,y: 1}));
      bindPress(leftBtn,  () => setDir({x:-1,y:0}));
      bindPress(rightBtn, () => setDir({x: 1,y:0}));

      overlay.addEventListener("pointerdown", (e) => {
        e.preventDefault();
        e.stopPropagation();
        reset();
      }, { passive:false });

      let start = null;
      canvas.addEventListener("pointerdown", (e) => {
        if (gameOver){
          e.preventDefault();
          reset();
          return;
        }
        start = {x:e.clientX, y:e.clientY};
      }, { passive:false });

      canvas.addEventListener("pointerup", (e) => {
        if (!start) return;
        const end = {x:e.clientX, y:e.clientY};
        const dx = end.x - start.x;
        const dy = end.y - start.y;
        start = null;

        const min = 30;
        if (Math.abs(dx) > Math.abs(dy) && Math.abs(dx) > min){
          setDir({x: dx > 0 ? 1 : -1, y:0});
        } else if (Math.abs(dy) > Math.abs(dx) && Math.abs(dy) > min){
          setDir({x:0, y: dy > 0 ? 1 : -1});
        }
      }, { passive:false });

      canvas.addEventListener("pointermove", (e) => e.preventDefault(), { passive:false });
      document.addEventListener("touchmove", (e) => e.preventDefault(), { passive:false });

      let rTimer = null;
      window.addEventListener("resize", () => {
        clearTimeout(rTimer);
        rTimer = setTimeout(resize, 80);
      });
      window.addEventListener("orientationchange", () => setTimeout(resize, 120));

      document.addEventListener("keydown", e=>{const dirs={ArrowUp:{x:0,y:-1},ArrowDown:{x:0,y:1},ArrowLeft:{x:-1,y:0},ArrowRight:{x:1,y:0}};if(dirs[e.key]){e.preventDefault();setDir(dirs[e.key]);}else if(gameOver&&(e.key==="Enter"||e.key===" ")){e.preventDefault();reset();}});
      loadHighScore();
      resize();
      reset();
      requestAnimationFrame(loop);
    })();
  </script>
</body>
</html>
